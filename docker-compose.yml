services:
  service-postgres-server:
    image: rtravez/service-postgres-server:latest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - cloud-rtravez
    environment:
      POSTGRES_DB: ${DB_NAME:-db_test}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}

  msc-service:
    image: rtravez/msc-service:latest
    container_name: msc-service
    ports:
      - "8081:8081"
    volumes:
      - springdata:/tmp
    restart: always
    networks:
      - cloud-rtravez
    environment:
      SERVER_PORT: ${MSC_SERVICE_PORT:-8081}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

  msa-service:
    image: rtravez/msa-service:latest
    container_name: msa-service
    env_file:
      - .env
    ports:
      - "8082:8082"
    volumes:
      - springdata:/tmp
    restart: always
    networks:
      - cloud-rtravez
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${MSA_SERVICE_PORT:-8082}
      SERVER_SERVLET_CONTEXT_PATH: ${MSA_CONTEXT_PATH:-/msaServices}
      DB_URL: ${DB_URL:-jdbc:postgresql://service-postgres-server:5432/db_test}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8080/authorizationServer}
      MSC_SERVICE_URL: ${MSC_SERVICE_URL:-/mscServices/api/users/findUserByIdentification}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
    depends_on:
      - service-postgres-server
      - msc-service

networks:
  cloud-rtravez:

volumes:
  pgdata:
  springdata:
