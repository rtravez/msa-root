# ============================================================
# Production Profile Configuration
# ============================================================
# Active profile for production environment
# Use environment variables for sensitive data

# ============================================================
# Server
# ============================================================
server.port=${SERVER_PORT}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================================
# DataSource / Hikari Connection Pool (External PostgreSQL)
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.leak-detection-threshold=15000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================================
# Logging (Production - ERROR level)
# ============================================================
logging.level.root=WARN
logging.level.com.rtravez.msa=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.file.name=/var/log/msa-service/msa-service.log
logging.file.max-size=50MB
logging.file.max-history=30

# ============================================================
# Spring Security / OAuth2 (Production)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}

# ============================================================
# Actuator / Observability (Limited endpoints in prod)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# ============================================================
# Performance & Security
# ============================================================
server.max-http-request-header-size=8KB
server.tomcat.max-swallow-size=2MB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ============================================================
# External Service URLs (Production)
# ============================================================
spring.urls.find-user-by-identification=${MSC_SERVICE_URL}
