# ============================================================
# Development Profile Configuration
# ============================================================
# Active profile for development environment

# ============================================================
# Server
# ============================================================
server.port=8082
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ============================================================
# DataSource / Hikari Connection Pool (Local PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_test
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true

# ============================================================
# Logging (Development - DEBUG level)
# ============================================================
logging.level.root=INFO
logging.level.com.rtravez.msa=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=/tmp/log/msa-service/msa-service.log
logging.file.max-size=10MB
logging.file.max-history=10

# ============================================================
# Spring Security / OAuth2 (Local)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/authServices

# ============================================================
# Actuator / Observability (All endpoints exposed in dev)
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ============================================================
# External Service URLs (Development)
# ============================================================
spring.urls.find-user-by-identification=http://localhost:8081/mscServices/api/users/findUserByIdentification
