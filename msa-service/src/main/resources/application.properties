# ============================================================
# Spring Boot Microservices App
# Default Configuration (Common across all profiles)
# Override in application-{profile}.properties
# ============================================================
spring.application.name=msa-service
spring.info.build.encoding=UTF-8

# ============================================================
# Server - Common Configuration
# ============================================================
server.servlet.context-path=/msaServices
server.max-http-request-header-size=8KB

# ============================================================
# Tomcat - Server Access Logs
# ============================================================
server.tomcat.max-swallow-size=2MB
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log

# ============================================================
# JPA / Hibernate - Common Configuration
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ============================================================
# Jackson - Date and Locale Configuration
# ============================================================
spring.jackson.time-zone=America/Guayaquil
spring.jackson.locale=es_EC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false

# ============================================================
# Multipart Configuration
# ============================================================
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ============================================================
# Application-specific Network Configuration
# ============================================================
# Comma-separated IPs of reverse proxies allowed providing forwarding headers.
app.network.trusted-proxies=127.0.0.1,::1

# ============================================================
# Actuator / Observability - Base Configuration
# ============================================================
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.endpoint.shutdown.enabled=false

# ============================================================
# Default Logging Level (Override in profile-specific configs)
# ============================================================
logging.level.root=INFO

# ============================================================
# External Service URLs
# ============================================================
spring.urls.find-user-by-identification=http://localhost:8081/mscServices/api/users/findUserByIdentification