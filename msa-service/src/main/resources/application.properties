# ============================================================
# Spring Boot Microservices App
# ============================================================
spring.application.name=msa-service
spring.info.build.encoding=UTF-8

# ============================================================
# Server
# ============================================================
server.port=8082
server.servlet.context-path=/msaServices
server.max-http-request-header-size=8KB

# ============================================================
# Tomcat
# ============================================================
server.tomcat.max-swallow-size=2MB

# Tomcat Server Access Logs
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log

# ============================================================
# DataSource / Hikari Connection Pool
# ============================================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/db_test
spring.datasource.url=jdbc:postgresql://postgres:5432/db_test
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# ============================================================
# JPA / Hibernate
# ============================================================
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
logging.level.org.hibernate.SQL=debug

# ============================================================
# Spring Security / OAuth2
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/authorizationServer

# ============================================================
# Network
# ============================================================
# Comma-separated IPs of reverse proxies allowed providing forwarding headers.
app.network.trusted-proxies=127.0.0.1,::1

# ============================================================
# Jackson
# ============================================================
spring.jackson.time-zone=America/Guayaquil
spring.jackson.locale=es_EC

# ============================================================
# Multipart
# ============================================================
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ============================================================
# Actuator / Observability
# ============================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ============================================================
# Logging
# ============================================================
logging.file.name=/tmp/msa-service.log
logging.level.org.springframework=INFO