#Info SpringBoot Microservices App
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=${APP_NAME:msa-service}
spring.info.build.encoding=UTF-8

#Spring DataSource Basic Config
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Hikari connection pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

##Hibernate ORM
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8080/authorizationServer}
# Comma-separated IPs of reverse proxies allowed providing forwarding headers.
app.network.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1,::1}
#spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

spring.jackson.time-zone=America/Guayaquil
spring.jackson.locale=es_EC
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Tomcat Server Basic Config
server.port=${SERVER_PORT:8082}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/msaServices}
server.max-http-request-header-size=${SERVER_MAX_HTTP_HEADER_SIZE:8KB}
server.tomcat.max-swallow-size=${SERVER_MAX_SWALLOW_SIZE:2MB}

#Tomcat Server Access Logs
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log

#Logs
logging.file.name=/tmp/msa-service.log
logging.level.org.springframework=INFO
#logging.level.org.hibernate=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE

# Actuator / observability
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

#Url
spring.urls.find-user-by-identification=${MSC_SERVICE_URL:/mscServices/api/users/findUserByIdentification}