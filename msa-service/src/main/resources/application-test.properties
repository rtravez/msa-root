# ============================================================
# Test Profile Configuration
# ============================================================
# Active profile for automated testing environment

# ============================================================
# Server
# ============================================================
server.port={SERVER_PORT}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# ============================================================
# DataSource / Hikari Connection Pool
# ============================================================
spring.datasource.url={SPRING_DATASOURCE_URL}
spring.datasource.username={SPRING_DATASOURCE_USERNAME}
spring.datasource.password={SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_UNCOMMITTED

# ============================================================
# JPA / Hibernate
# ============================================================
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true

# ============================================================
# Logging (Test - WARN level)
# ============================================================
logging.level.root=WARN
logging.level.com.rtravez.msc=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.test=DEBUG

# ============================================================
# Spring Security / OAuth2 (Test)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri={SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

# ============================================================
# Actuator / Observability (Test)
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ============================================================
# External Service URLs (Test)
# ============================================================
spring.urls.find-user-by-identification={SPRING_URLS_FIND_USER_BY_IDENTIFICATION}
