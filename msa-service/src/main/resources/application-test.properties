# ============================================================
# Test Profile Configuration
# ============================================================
# Active profile for automated testing environment

# ============================================================
# Server
# ============================================================
server.port=0
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# ============================================================
# DataSource / Hikari Connection Pool (H2 In-Memory)
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_UNCOMMITTED

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true

# ============================================================
# H2 Console (Only for testing)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Logging (Test - WARN level)
# ============================================================
logging.level.root=WARN
logging.level.com.rtravez.msc=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.test=DEBUG

# ============================================================
# Spring Security / OAuth2 (Test)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/authServices

# ============================================================
# Actuator / Observability (Test)
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ============================================================
# External Service URLs (Test)
# ============================================================
spring.urls.find-user-by-identification=http://localhost:8081/mscServices/api/users/findUserByIdentification
