# Authentication must be supplied by the CI environment, never committed.
# Example: mvn sonar:sonar -Dsonar.token="$SONAR_TOKEN"
sonar.projectKey=msa-root

# --- optional properties ---

# defaults to project key
sonar.projectName=msa-root
# defaults to 'not provided'
#sonar.projectVersion=1.0
 
# Analyze only production Java sources from the Maven modules.
sonar.sources=msa-client/src/main/java,msa-core/src/main/java,msa-dto/src/main/java,msa-service/src/main/java
 
# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/target/**,**/generated-sources/**,**/src/test/**
sonar.java.binaries=msa-client/target/classes,msa-core/target/classes,msa-dto/target/classes,msa-service/target/classes
sonar.scm.provider=git
#sonar.scm.disabled=true